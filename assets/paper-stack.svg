<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" width="520" height="360" role="img" aria-label="一疊印著條狀文字的 paper，上面放著放大鏡">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef1ff"/>
      <stop offset="1" stop-color="#e3f6f2"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f3f5fc"/>
    </linearGradient>
  </defs>

  <rect width="520" height="360" rx="18" fill="url(#bg)"/>

  <!-- 後方紙張 -->
  <g transform="rotate(-7 260 190)">
    <rect x="118" y="52" width="272" height="248" rx="10" fill="#dfe4f7" stroke="#c9d0ea" stroke-width="2"/>
  </g>
  <g transform="rotate(4 260 190)">
    <rect x="118" y="52" width="272" height="248" rx="10" fill="url(#page)" stroke="#d7dcef" stroke-width="2"/>
  </g>

  <!-- 主體紙張 -->
  <rect x="112" y="46" width="272" height="248" rx="10" fill="url(#page)" stroke="#cfd6ee" stroke-width="2.5"/>
  <rect x="136" y="70" width="120" height="12" rx="6" fill="#3f5efb" opacity="0.85"/>
  <rect x="136" y="98" width="224" height="9" rx="4.5" fill="#c3c9e0"/>
  <rect x="136" y="118" width="196" height="9" rx="4.5" fill="#c3c9e0"/>
  <rect x="136" y="138" width="216" height="9" rx="4.5" fill="#c3c9e0"/>
  <rect x="136" y="158" width="150" height="9" rx="4.5" fill="#c3c9e0"/>
  <g opacity="0.85">
    <rect x="136" y="186" width="104" height="70" rx="8" fill="#e8ecff"/>
    <rect x="150" y="248" width="76" height="7" rx="3.5" fill="#8f9ae0"/>
    <rect x="150" y="224" width="58" height="7" rx="3.5" fill="#8f9ae0"/>
    <rect x="150" y="200" width="42" height="7" rx="3.5" fill="#8f9ae0"/>
  </g>
  <g opacity="0.85">
    <rect x="256" y="186" width="104" height="70" rx="8" fill="#e0f5f1"/>
    <rect x="270" y="200" width="42" height="7" rx="3.5" fill="#63b3a8"/>
    <rect x="270" y="224" width="58" height="7" rx="3.5" fill="#63b3a8"/>
    <rect x="270" y="248" width="76" height="7" rx="3.5" fill="#63b3a8"/>
  </g>

  <!-- 放大鏡 -->
  <g transform="translate(330 214)">
    <circle cx="34" cy="34" r="40" fill="#ffffff" fill-opacity="0.9" stroke="#3f5efb" stroke-width="7"/>
    <circle cx="34" cy="34" r="28" fill="#dfe4ff" opacity="0.55"/>
    <path d="M62 62 L92 92" stroke="#3f5efb" stroke-width="12" stroke-linecap="round"/>
    <path d="M22 30 h24 M22 40 h16" stroke="#6f7fd8" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- 書籤 -->
  <g transform="translate(330 46)">
    <path d="M0 0 h30 v52 l-15 -11 -15 11 z" fill="#0f9b8e"/>
  </g>
</svg>
