<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" width="560" height="320" role="img" aria-label="paper 到筆記到專案的三段流程圖">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a93b8"/>
    </marker>
  </defs>

  <rect width="560" height="320" rx="16" fill="#f2f4ff"/>

  <!-- 步驟 1 -->
  <g transform="translate(36 70)">
    <rect width="140" height="180" rx="12" fill="#ffffff" stroke="#cfd6ee" stroke-width="2.5"/>
    <rect x="22" y="20" width="82" height="9" rx="4.5" fill="#3f5efb"/>
    <rect x="22" y="44" width="96" height="7" rx="3.5" fill="#c3c9e0"/>
    <rect x="22" y="60" width="88" height="7" rx="3.5" fill="#c3c9e0"/>
    <rect x="22" y="76" width="96" height="7" rx="3.5" fill="#c3c9e0"/>
    <rect x="22" y="92" width="70" height="7" rx="3.5" fill="#c3c9e0"/>
    <circle cx="70" cy="140" r="22" fill="#e8ecff" stroke="#3f5efb" stroke-width="4"/>
    <path d="M62 140 h16 M70 132 v16" stroke="#3f5efb" stroke-width="4" stroke-linecap="round"/>
    <text x="70" y="205" text-anchor="middle" font-family="WenQuanYi Zen Hei, sans-serif" font-size="17" fill="#3a4160">Paper</text>
  </g>

  <path d="M186 160 H226" stroke="#8a93b8" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- 步驟 2 -->
  <g transform="translate(212 70)">
    <rect width="140" height="180" rx="12" fill="#ffffff" stroke="#cfd6ee" stroke-width="2.5"/>
    <rect x="22" y="20" width="70" height="9" rx="4.5" fill="#0f9b8e"/>
    <rect x="22" y="44" width="96" height="7" rx="3.5" fill="#c3c9e0"/>
    <rect x="22" y="60" width="80" height="7" rx="3.5" fill="#c3c9e0"/>
    <rect x="22" y="76" width="90" height="7" rx="3.5" fill="#c3c9e0"/>
    <rect x="22" y="96" width="96" height="7" rx="3.5" fill="#c3c9e0"/>
    <rect x="22" y="116" width="58" height="7" rx="3.5" fill="#c3c9e0"/>
    <rect x="26" y="140" width="88" height="16" rx="8" fill="#e0f5f1"/>
    <text x="70" y="205" text-anchor="middle" font-family="WenQuanYi Zen Hei, sans-serif" font-size="17" fill="#3a4160">筆記</text>
  </g>

  <path d="M362 160 H402" stroke="#8a93b8" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- 步驟 3 -->
  <g transform="translate(388 70)">
    <rect width="140" height="180" rx="12" fill="#ffffff" stroke="#cfd6ee" stroke-width="2.5"/>
    <rect x="20" y="22" width="100" height="54" rx="8" fill="#e8ecff" stroke="#3f5efb" stroke-width="3"/>
    <rect x="30" y="34" width="52" height="7" rx="3.5" fill="#3f5efb"/>
    <rect x="30" y="50" width="76" height="7" rx="3.5" fill="#8f9ae0"/>
    <rect x="30" y="62" width="40" height="7" rx="3.5" fill="#8f9ae0"/>
    <rect x="20" y="92" width="100" height="64" rx="8" fill="#e0f5f1"/>
    <rect x="32" y="106" width="44" height="7" rx="3.5" fill="#0f9b8e"/>
    <rect x="32" y="122" width="66" height="7" rx="3.5" fill="#63b3a8"/>
    <rect x="32" y="138" width="52" height="7" rx="3.5" fill="#63b3a8"/>
    <text x="70" y="205" text-anchor="middle" font-family="WenQuanYi Zen Hei, sans-serif" font-size="17" fill="#3a4160">專案／網頁</text>
  </g>
